[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlfluff-templater-sqlsource"
# Never edit this: CI sets the real version when it publishes.
version = "0.0.0.dev0"
description = "A sqlfluff templater for SqlSource queries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sqlfluff>=4.0,<5"]

[project.entry-points.sqlfluff]
sqlfluff_templater_sqlsource = "sqlfluff_templater_sqlsource"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.hatch.build.targets.wheel]
packages = ["sqlfluff_templater_sqlsource"]

[tool.hatch.build.targets.sdist]
only-include = ["sqlfluff_templater_sqlsource", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
