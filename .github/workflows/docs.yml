# Publishes the manual, site/, to GitHub Pages: by hand, building the branch the run is started on, or called by
# publish.yml after a v* tag's release, building the tag.  The site shows one version, so each run replaces it.
# The github-pages environment deploys from branch main and tags v* alone: a run from another branch builds the site
# and fails at the deploy.  See docs/publishing.md.
name: Docs

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One deploy at a time, and none cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build the site
        run: tools/build-site.sh

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
