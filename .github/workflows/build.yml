# Runs every check, builds, tests, packs and reports coverage.  Called by ci.yml and publish.yml.
# The check steps mirror pre-commit-validation.sh: a check added to one is added to the other in the same commit.
# Every job starts at once and none needs another, so that the run takes as long as its slowest job and a failure in
# one job hides nothing in the others.  A job pays for its own build, which is cheaper than waiting for a shared one.
# The NuGet cache of each job is keyed on the lock files of what it restores, with dotnet-tools.json when it restores
# the tools.  The first job to finish saves the cache under its key, so two jobs that restore different packages must
# never share a key, or the cache could hold only the packages of the smaller job.
name: Build

on:
  workflow_call:
    inputs:
      version-suffix:
        description: Prerelease suffix of the package version.  Empty for a release build.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  SOLUTION: SqlSource.slnx
  CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'
  # MSBuild reads environment variables as properties, so every dotnet command of every job sees the same version.
  BuildNumber: ${{ github.run_number }}
  VersionSuffix: ${{ inputs.version-suffix }}

jobs:
  # The checks that need only Docker.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every check runs even when an earlier one failed, so that one run reports every problem.
      - name: Check .editorconfig
        if: ${{ !cancelled() }}
        run: tools/editorconfig-checker.sh

      - name: Lint shell scripts
        if: ${{ !cancelled() }}
        run: tools/shellcheck.sh

      - name: Check shell script formatting
        if: ${{ !cancelled() }}
        run: tools/shfmt.sh --check

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: tools/actionlint.sh

  # format.sh --check is split in two, because dotnet format style and dotnet format analyzers each compile the
  # solution and together are the slowest check.  CSharpier, which takes seconds, goes with the faster of the two.
  format-style:
    name: 'Format check: style and CSharpier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: ./format.sh --check style csharpier

  format-analyzers:
    name: 'Format check: analyzers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Check formatting
        run: ./format.sh --check analyzers

  build:
    name: Build, test and report coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore "$SOLUTION"

      # The default image of each engine is pulled in the background while the solution builds.  The pull writes its
      # log, and when it ends its exit status, to RUNNER_TEMP; "Wait for test images" prints the log, with the seconds
      # each pull took, and fails if the pull failed.  The status is moved into place so that it is never read half
      # written.
      - name: Start pulling test images
        run: |
          log="$RUNNER_TEMP/pull-test-images.log"
          status="$RUNNER_TEMP/pull-test-images.status"
          (
              rc=0
              tools/pull-test-images.sh || rc=$?
              echo "$rc" >"$status.tmp"
              mv "$status.tmp" "$status"
          ) >"$log" 2>&1 &

      - name: Build
        id: build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      - name: Wait for test images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status="$RUNNER_TEMP/pull-test-images.status"
          until [[ -f "$status" ]]; do
              sleep 1
          done
          cat "$RUNNER_TEMP/pull-test-images.log"
          exit "$(cat "$status")"

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test --solution "$SOLUTION" --configuration "$CONFIGURATION" --no-build
          --results-directory artifacts/test-results
          --coverage --coverage-output-format cobertura
          --report-github

      - name: Report coverage
        id: coverage
        if: ${{ !cancelled() && hashFiles('artifacts/test-results/*.cobertura.xml') != '' }}
        run: |
          dotnet reportgenerator \
              '-reports:artifacts/test-results/*.cobertura.xml' \
              -targetdir:artifacts/coverage \
              '-reporttypes:Html;Cobertura;MarkdownSummaryGithub' \
              '-assemblyfilters:+SqlSource;+SqlSource.Tool'
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error

  # The build job ran every test of tests/SqlSource.Tests.Postgres, the describer's and the end-to-end project's, on
  # the default image.  This runs them again on the oldest PostgreSQL that is supported: see
  # tests/SqlSource.Tests.Postgres/README.md.
  test-postgres-floor:
    name: Test on PostgreSQL 14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: tests/SqlSource.Tests.Postgres
      # The oldest image that is supported, pinned as every image of the tests is: see rule 5 of AGENTS.md.
      POSTGRES_FLOOR_IMAGE: postgres:14.24
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: tests/SqlSource.Tests.Postgres/packages.lock.json

      - name: Build
        run: dotnet build "$PROJECT" --configuration "$CONFIGURATION"

      # A pull is a step of its own, so that the time it takes shows apart from the time the tests take.
      - name: Pull test image
        run: docker pull --quiet "$POSTGRES_FLOOR_IMAGE"

      - name: Test
        env:
          SQLSOURCE_TESTS_POSTGRES_IMAGE: ${{ env.POSTGRES_FLOOR_IMAGE }}
        run: dotnet test --project "$PROJECT" --configuration "$CONFIGURATION" --no-build --report-github

  # The same for tests/SqlSource.Tests.SqlServer, which the build job ran on the default image, on the oldest SQL Server
  # that is supported: see tests/SqlSource.Tests.SqlServer/README.md.
  test-sqlserver-floor:
    name: Test on SQL Server 2017
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: tests/SqlSource.Tests.SqlServer
      # The oldest image that is supported, pinned as every image of the tests is: see rule 5 of AGENTS.md.
      SQLSERVER_FLOOR_IMAGE: mcr.microsoft.com/mssql/server:2017-CU31-GDR19-ubuntu-18.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: tests/SqlSource.Tests.SqlServer/packages.lock.json

      - name: Build
        run: dotnet build "$PROJECT" --configuration "$CONFIGURATION"

      # A pull is a step of its own, so that the time it takes shows apart from the time the tests take.
      - name: Pull test image
        run: docker pull --quiet "$SQLSERVER_FLOOR_IMAGE"

      - name: Test
        env:
          SQLSOURCE_TESTS_SQLSERVER_IMAGE: ${{ env.SQLSERVER_FLOOR_IMAGE }}
        run: dotnet test --project "$PROJECT" --configuration "$CONFIGURATION" --no-build --report-github

  # Packs the generator and the tool, checks both packages, and uploads them for publish.yml.  The package checks do
  # not wait for the tests: publish.yml needs the whole of this workflow, so a package is never pushed from a run whose
  # tests failed.
  package:
    name: Pack and check packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/*/packages.lock.json

      - name: Pack
        id: pack
        run: |
          for project in src/SqlSource/SqlSource.csproj src/SqlSource.Tool/SqlSource.Tool.csproj; do
              dotnet pack "$project" --configuration "$CONFIGURATION" --output artifacts/packages
          done

      # Every check of the packages runs even when an earlier one failed, so that one run reports every problem.
      - name: Check package
        run: tools/check-package.sh artifacts/packages

      - name: Check package install
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: tools/check-package-install.sh artifacts/packages

      - name: Check tool install
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: tools/check-tool-install.sh artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
