# Runs every check, builds, tests, packs and reports coverage.  Called by ci.yml and publish.yml.
# The check steps mirror pre-commit-validation.sh: a check added to one is added to the other in the same commit.
# A check that needs the .NET SDK goes in the build job; one that needs only Docker goes in the lint job.
name: Build

on:
  workflow_call:
    inputs:
      version-suffix:
        description: Prerelease suffix of the package version.  Empty for a release build.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  SOLUTION: SqlSource.slnx
  CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'

jobs:
  # The checks that need only Docker.  They run beside the build so that neither waits for, or hides, the other.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every check runs even when an earlier one failed, so that one run reports every problem.
      - name: Check .editorconfig
        if: ${{ !cancelled() }}
        run: tools/editorconfig-checker.sh

      - name: Lint shell scripts
        if: ${{ !cancelled() }}
        run: tools/shellcheck.sh

      - name: Check shell script formatting
        if: ${{ !cancelled() }}
        run: tools/shfmt.sh --check

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: tools/actionlint.sh

  build:
    name: Format check, build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # MSBuild reads environment variables as properties, so every dotnet command in this job sees the same version.
      BuildNumber: ${{ github.run_number }}
      VersionSuffix: ${{ inputs.version-suffix }}
      # The oldest image of each engine that is supported, pinned as every image of the tests is: see rule 5 of
      # AGENTS.md.  Each is pulled once, in its own step, and run by the step that tests on it.
      POSTGRES_FLOOR_IMAGE: postgres:14.24
      SQLSERVER_FLOOR_IMAGE: mcr.microsoft.com/mssql/server:2017-CU31-GDR19-ubuntu-18.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore "$SOLUTION"

      # The build and tests run even when the format check failed, so that one run reports every problem.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: ./format.sh --check

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      # A pull is a step of its own, so that the time it takes shows apart from the time the tests take.  It pulls the
      # default image of each engine and the two floor images.
      - name: Pull test images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/pull-test-images.sh "$POSTGRES_FLOOR_IMAGE" "$SQLSERVER_FLOOR_IMAGE"

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test --solution "$SOLUTION" --configuration "$CONFIGURATION" --no-build
          --results-directory artifacts/test-results
          --coverage --coverage-output-format cobertura
          --report-github

      # The Test step ran every test of tests/SqlSource.Tests.Postgres, the describer's and the end-to-end
      # project's, on the default image.  This runs them again on the oldest PostgreSQL that is supported: see
      # tests/SqlSource.Tests.Postgres/README.md.
      - name: Test on PostgreSQL 14
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SQLSOURCE_TESTS_POSTGRES_IMAGE: ${{ env.POSTGRES_FLOOR_IMAGE }}
        run: >-
          dotnet test --project tests/SqlSource.Tests.Postgres --configuration "$CONFIGURATION" --no-build
          --report-github

      # The same for tests/SqlSource.Tests.SqlServer, which the Test step ran on the default image, on the oldest
      # SQL Server that is supported: see tests/SqlSource.Tests.SqlServer/README.md.
      - name: Test on SQL Server 2017
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SQLSOURCE_TESTS_SQLSERVER_IMAGE: ${{ env.SQLSERVER_FLOOR_IMAGE }}
        run: >-
          dotnet test --project tests/SqlSource.Tests.SqlServer --configuration "$CONFIGURATION" --no-build
          --report-github

      - name: Report coverage
        id: coverage
        if: ${{ !cancelled() && hashFiles('artifacts/test-results/*.cobertura.xml') != '' }}
        run: |
          dotnet reportgenerator \
              '-reports:artifacts/test-results/*.cobertura.xml' \
              -targetdir:artifacts/coverage \
              '-reporttypes:Html;Cobertura;MarkdownSummaryGithub' \
              '-assemblyfilters:+SqlSource;+SqlSource.Tool'
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error

      - name: Pack
        run: dotnet pack "$SOLUTION" --configuration "$CONFIGURATION" --no-build --output artifacts/packages

      - name: Check package
        run: tools/check-package.sh artifacts/packages

      - name: Check package install
        run: tools/check-package-install.sh artifacts/packages

      - name: Check tool install
        run: tools/check-tool-install.sh artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
