name: Bug report
description: A model, a type, a nullability or an error of SqlSource that is not what you expected.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        For a query whose model is wrong, or that the tool refuses, make a bundle of it with
        `dotnet sqlsource diagnose --query <file>:<name> --out <path outside your project>.zip` and attach the
        zip below.  Your names and strings are renamed in it, and a maintainer can run SqlSource on it with no database:
        see [reporting a wrong model](https://github.com/mbcrawfo/SqlSource/blob/main/docs/manual/tool.md#report-a-bug).
  - type: markdown
    attributes:
      value: >-
        **Never attach the `.mapping.json` file written beside the bundle, nor a raw bundle that `--no-obfuscate`
        wrote.**  Both hold your own names.  If you have a raw bundle, do not attach it: say below that it is ready,
        and a maintainer will say how to send it.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The model, type, nullability or result you expected, and why.
    validations:
      required: true
  - type: textarea
    id: given
    attributes:
      label: What did you get?
      description: >-
        What SqlSource gave instead: the generated code, the error with its `SQLSRC` id, or what the tool printed.
        Leave out any name or value you may not share.
    validations:
      required: true
  - type: input
    id: sqlsource-version
    attributes:
      label: Version of sqlsource
      description: What `dotnet sqlsource --version` prints.
    validations:
      required: true
  - type: input
    id: database-version
    attributes:
      label: Database and its version
      description: Such as PostgreSQL 18.6, or SQL Server 2022 CU27.
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: Version of the .NET SDK
      description: What `dotnet --version` prints.
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Bundle
      description: >-
        Drag the bundle's zip here.  Never the `.mapping.json` file beside it, and never a raw bundle.
  - type: checkboxes
    id: raw-bundle
    attributes:
      label: Raw bundle
      options:
        - label: >-
            `diagnose` could not rename the bundle, and I have a raw bundle ready, which I have not attached.
          required: false
  - type: checkboxes
    id: nothing-private
    attributes:
      label: Before you submit
      options:
        - label: I have attached no `.mapping.json` file and no raw bundle.
          required: true
